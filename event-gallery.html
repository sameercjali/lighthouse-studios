<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Event Gallery — The Light House Studios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050505;
      --panel:#101010;
      --text:#f5c400;
      --muted:#999;
      --gold:#999;
      --line:#242424;
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Poppins,Arial,sans-serif;
      min-height:100vh;
    }

    a{color:inherit}

    /* Slim cinematic header */
    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      height:58px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 3.2vw;
      background:rgba(5,5,5,.95);
      border-bottom:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(12px);
    }

    .brand img{
      width:54px;
      height:auto;
      display:block;
    }

    .back{
      display:inline-flex;
      align-items:center;
      gap:7px;
      color:#ddd;
      text-decoration:none;
      font-size:12px;
      font-weight:600;
      letter-spacing:.04em;
      transition:color .25s ease;
    }

    .back:hover{color:var(--gold)}

    .page{
      width:min(1120px,90vw);
      margin:0 auto;
      padding:44px 0 60px;
    }

    /* Compact editorial heading */
    .heading{
      text-align:center;
      margin:0 auto 30px;
      max-width:850px;
    }

    .eyebrow{
      color:var(--gold);
      font-size:10px;
      font-weight:600;
      letter-spacing:.2em;
      text-transform:uppercase;
      margin:0 0 8px;
    }

    h1{
      margin:0;
      font-family:"Playfair Display",Georgia,serif;
      font-size:clamp(34px,4.8vw,58px);
      line-height:1.05;
      font-weight:700;
    }

    .rule{
      width:60px;
      height:2px;
      margin:14px auto 0;
      background:var(--gold);
    }

    .description{
      width:min(680px,100%);
      margin:15px auto 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.7;
    }

    /* Hero */
    .hero{
      background:var(--panel);
      border:1px solid var(--line);
      overflow:hidden;
      margin-bottom:12px;
    }

    .hero img,
    .hero video{
      display:block;
      width:100%;
      aspect-ratio:16/9;
      object-fit:cover;
      background:#000;
    }

    /* Photography grid: varied rows, no oversized cards */
    .gallery{
      display:grid;
      grid-template-columns:repeat(12,minmax(0,1fr));
      grid-auto-flow:dense;
      gap:10px;
    }

    .gallery-item{
      grid-column:span 4;
      background:var(--panel);
      border:1px solid var(--line);
      overflow:hidden;
      min-width:0;
    }

    .gallery-item:nth-child(5n+1){grid-column:span 6}
    .gallery-item:nth-child(5n+2){grid-column:span 6}
    .gallery-item:nth-child(5n+3){grid-column:span 4}
    .gallery-item:nth-child(5n+4){grid-column:span 4}
    .gallery-item:nth-child(5n+5){grid-column:span 4}

    .gallery-item img,
    .gallery-item video{
      display:block;
      width:100%;
      aspect-ratio:4/3;
      object-fit:cover;
      background:#000;
      transition:transform .45s ease,filter .45s ease;
    }

    .gallery-item:hover img,
    .gallery-item:hover video{
      transform:scale(1.025);
      filter:brightness(.88);
    }

    .empty,
    .error{
      text-align:center;
      padding:52px 18px;
      color:var(--muted);
      background:var(--panel);
      border:1px solid var(--line);
    }

    .error strong{
      display:block;
      color:#fff;
      margin-bottom:6px;
    }

    .loading{
      text-align:center;
      color:var(--muted);
      padding:55px 18px;
    }

    @media(max-width:800px){
      .topbar{
        height:54px;
        padding:0 16px;
      }

      .brand img{width:48px}

      .page{
        width:min(92vw,700px);
        padding:34px 0 45px;
      }

      .heading{margin-bottom:24px}

      .description{
        font-size:12px;
        line-height:1.65;
      }

      .gallery{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:8px;
      }

      .gallery-item,
      .gallery-item:nth-child(n){
        grid-column:span 1;
      }

      .gallery-item:nth-child(3n+1){
        grid-column:span 2;
      }
    }

    @media(max-width:480px){
      .topbar{
        height:50px;
        padding:0 13px;
      }

      .brand img{width:44px}

      .back{font-size:11px}

      .page{
        width:94vw;
        padding:28px 0 38px;
      }

      .heading{margin-bottom:19px}

      h1{font-size:31px}

      .description{
        font-size:11.5px;
        margin-top:12px;
      }

      .gallery{
        grid-template-columns:1fr;
        gap:8px;
      }

      .gallery-item,
      .gallery-item:nth-child(n){
        grid-column:span 1;
      }

      .gallery-item:nth-child(3n+1){
        grid-column:span 1;
      }

      .gallery-item img,
      .gallery-item video{
        aspect-ratio:16/10;
      }

      .hero{margin-bottom:8px}
    }
  </style>

<style id="event-gallery-final-grid-fix">
/* ==========================================================
   FINAL GALLERY GRID FIX
   Each card owns its height. The image fills the card.
   This prevents CSS Grid rows from stretching cards and
   producing the black areas seen underneath thumbnails.
   ========================================================== */

.gallery{
  align-items:start !important;
  grid-auto-rows:auto !important;
}

.gallery-item{
  position:relative !important;
  align-self:start !important;
  height:auto !important;
  min-height:0 !important;
  overflow:hidden !important;
  aspect-ratio:4 / 3 !important;
}

/* The first two cards of each 7-image rhythm are wider 16:9 cards. */
.gallery-item:nth-child(7n+1),
.gallery-item:nth-child(7n+2){
  aspect-ratio:16 / 9 !important;
}

.gallery-item img,
.gallery-item video{
  position:absolute !important;
  inset:0 !important;
  display:block !important;
  width:100% !important;
  height:100% !important;
  min-width:0 !important;
  min-height:0 !important;
  object-fit:cover !important;
  object-position:50% 50%;
}

/* Keep the AI-selected focal position when the upload has one. */
.gallery-item img[style*="object-position"],
.gallery-item video[style*="object-position"]{
  object-position:var(--lh-object-position, 50% 50%);
}

/* Do not let the mobile rules create another aspect-ratio conflict. */
@media(max-width:800px){
  .gallery{
    align-items:start !important;
  }

  .gallery-item{
    aspect-ratio:4 / 3 !important;
  }

  .gallery-item:nth-child(7n+1),
  .gallery-item:nth-child(7n+2){
    aspect-ratio:16 / 9 !important;
  }
}

@media(max-width:480px){
  .gallery-item,
  .gallery-item:nth-child(7n+1),
  .gallery-item:nth-child(7n+2){
    aspect-ratio:4 / 3 !important;
  }
}

/* Lightbox is independent of the thumbnail crop. */
.lh-lightbox-media{
  position:static !important;
  inset:auto !important;
  width:auto !important;
  height:auto !important;
  max-width:100% !important;
  max-height:100% !important;
  object-fit:contain !important;
}
</style>

<body>
  <header class="topbar">
    <a class="brand" href="index.html#portfolio" aria-label="Back to portfolio">
      <img src="logo.png" alt="The Light House Studios">
    </a>
    <a class="back" href="index.html#portfolio">← Back to Portfolio</a>
  </header>

  <main class="page">
    <section class="heading" id="eventHeader">
      <div class="loading">Loading event...</div>
    </section>
    <section id="eventContent" aria-live="polite">
      <div class="loading">Loading photos...</div>
    </section>
  </main>

  <script type="module">
    import { getCollection } from "./dynamic-content.js";

    const eventHeader = document.getElementById("eventHeader");
    const eventContent = document.getElementById("eventContent");
    const eventId = new URLSearchParams(window.location.search).get("event");

    function esc(value=""){
      return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    }

    function mediaTypeOf(item){
      return (item && item.mediaType) ||
        (/\.mp4(?:$|[?#])/i.test(String(item && item.imageUrl || item || "")) ? "video" : "image");
    }

    function normalizeObjectPosition(value){
      if(typeof value !== "string" || !value.trim()) return "50% 50%";
      const match = value.trim().match(/^\s*(\d+(?:\.\d+)?)%\s+(\d+(?:\.\d+)?)%\s*$/);
      if(!match) return "50% 50%";
      return `${Math.max(0,Math.min(100,Number(match[1])))}% ${Math.max(0,Math.min(100,Number(match[2])))}%`;
    }

    function cloudinaryFaceSafeUrl(url, aspect="4:3"){
      const source = String(url || "");
      if(!/^https?:\/\/res\.cloudinary\.com\//i.test(source)) return source;
      if(!source.includes("/image/upload/")) return source;
      // Legacy images uploaded before AI face metadata existed get a Cloudinary
      // face-aware derived version automatically. New uploads use their stored
      // objectPosition instead, so this is only a compatibility fallback.
      const transformation = `c_fill,ar_${aspect},g_auto:faces,w_1600,q_auto,f_auto`;
      return source.replace("/image/upload/",`/image/upload/${transformation}/`);
    }

    function galleryOf(item){
      if(Array.isArray(item.gallery)){
        return item.gallery
          .map(x => typeof x === "string" ? {imageUrl:x} : x)
          .filter(x => x && x.imageUrl);
      }
      if(item.imageUrl) return [{imageUrl:item.imageUrl,title:item.title||""}];
      return [];
    }

    function renderMedia(url,type,alt,hero=false,mediaData={}){
      const objectPosition = normalizeObjectPosition(mediaData.objectPosition);
      const style = `style="object-position:${esc(objectPosition)};--lh-object-position:${esc(objectPosition)}"`;

      if(type === "video"){
        // Videos use their original source both in the page and lightbox.
        return `<video src="${esc(url)}" data-full-src="${esc(url)}" ${hero ? "controls " : ""}muted playsinline preload="metadata" aria-label="${esc(alt)}" ${style}></video>`;
      }

      /*
       * GRID:
       * Use Cloudinary's face-aware crop so faces are prioritised inside the
       * fixed grid aspect ratio.
       *
       * LIGHTBOX:
       * Keep the untouched uploaded URL in data-full-src. The lightbox must
       * use this URL rather than the cropped grid URL.
       */
      const gridUrl = cloudinaryFaceSafeUrl(
        url,
        mediaData.aspect || (hero ? "16:9" : "4:3")
      );

      return `<img src="${esc(gridUrl)}"
        data-full-src="${esc(url)}"
        alt="${esc(alt)}"
        loading="${hero ? "eager" : "lazy"}"
        ${style}>`;
    }

    async function loadEvent(){
      if(!eventId){
        eventHeader.innerHTML = '<div class="error"><strong>Event not found</strong><span>No event was selected.</span></div>';
        eventContent.innerHTML = "";
        return;
      }

      try{
        const items = await getCollection("portfolio");
        const item = items.find(x => x.id === eventId);

        if(!item){
          eventHeader.innerHTML = '<div class="error"><strong>Event not found</strong><span>This portfolio event may have been removed.</span></div>';
          eventContent.innerHTML = "";
          return;
        }

        const mainUrl = item.mainImageUrl || item.imageUrl || "";
        const mainType = item.mainMediaType ||
          (/\.mp4(?:$|[?#])/i.test(mainUrl) ? "video" : "image");
        const gallery = galleryOf(item);

        document.title = `${item.title || "Event Gallery"} — The Light House Studios`;
        eventHeader.innerHTML = `
          <p class="eyebrow">${esc(item.category || "Portfolio")}</p>
          <h1>${esc(item.title || "Untitled Event")}</h1>
          <div class="rule"></div>
          ${item.description ? `<p class="description">${esc(item.description)}</p>` : ""}
        `;

        let html = "";
        if(mainUrl){
          html += `<div class="hero">${renderMedia(mainUrl,mainType,`${item.title||"Event"} main media`,true)}</div>`;
        }

        if(gallery.length){
          html += `<div class="gallery" id="eventGalleryMasonry">${
            gallery.map((photo) =>
              `<div class="gallery-item">${renderMedia(photo.imageUrl,mediaTypeOf(photo),photo.title || "",false,photo)}</div>`
            ).join("")
          }</div>`;
        } else if(!mainUrl){
          html = '<div class="empty">No photos have been added to this event yet.</div>';
        }

        eventContent.innerHTML = html;

      }catch(error){
        console.error("Event gallery loading error:",error);
        eventHeader.innerHTML = '<div class="error"><strong>Unable to load this event</strong><span>Please try again.</span></div>';
        eventContent.innerHTML = "";
      }
    }

    loadEvent();
  </script>

<style id="event-gallery-masonry">
/* ==========================================================
   STABLE RESPONSIVE MASONRY
   CSS columns keep cards side-by-side at normal zoom levels
   and do not suffer from JavaScript image-load timing issues.
   ========================================================== */

.gallery{
  width:100% !important;
  display:block !important;
  column-count:3 !important;
  column-gap:12px !important;
  column-fill:balance !important;
}

.gallery-column{
  display:contents !important;
}

.gallery-item{
  display:block !important;
  width:100% !important;
  height:auto !important;
  min-height:0 !important;
  margin:0 0 12px !important;
  overflow:hidden !important;
  background:#0c0c0c;
  border:1px solid rgba(255,255,255,.09);
  border-radius:9px;
  box-shadow:0 8px 28px rgba(0,0,0,.22);
  position:relative !important;
  aspect-ratio:auto !important;
  break-inside:avoid !important;
  -webkit-column-break-inside:avoid !important;
  page-break-inside:avoid !important;
}

.gallery-item img,
.gallery-item video{
  display:block !important;
  position:static !important;
  inset:auto !important;
  width:100% !important;
  height:auto !important;
  min-width:0 !important;
  min-height:0 !important;
  aspect-ratio:auto !important;
  object-fit:cover !important;
  background:#000;
}

.gallery-item img[style*="object-position"],
.gallery-item video[style*="object-position"]{
  object-position:var(--lh-object-position,50% 50%);
}

.gallery-item:hover{
  transform:translateY(-2px);
  border-color:rgba(245,196,0,.35);
}

.gallery-item:hover img,
.gallery-item:hover video{
  transform:scale(1.025);
  filter:brightness(.9);
}

.hero img,
.hero video{
  width:100%;
  aspect-ratio:16/9;
  height:auto;
  object-fit:cover;
}

.lh-lightbox-media{
  position:static !important;
  inset:auto !important;
  width:auto !important;
  height:auto !important;
  max-width:100% !important;
  max-height:100% !important;
  object-fit:contain !important;
}

/* The number of columns is based on the actual CSS viewport width,
   so browser zoom does not trigger the old JS "all into column 1"
   image-load race. */
@media(max-width:900px){
  .gallery{
    column-count:2 !important;
    column-gap:8px !important;
  }

<!-- Cinematic image/video lightbox -->
<div class="lh-lightbox" id="lhLightbox" aria-hidden="true">
  <button class="lh-lightbox-close" id="lhLightboxClose" type="button" aria-label="Close">×</button>
  <button class="lh-lightbox-prev" id="lhLightboxPrev" type="button" aria-label="Previous image">‹</button>
  <div class="lh-lightbox-stage" id="lhLightboxStage"></div>
  <button class="lh-lightbox-next" id="lhLightboxNext" type="button" aria-label="Next image">›</button>
  <div class="lh-lightbox-caption" id="lhLightboxCaption"></div>
  <div class="lh-lightbox-counter" id="lhLightboxCounter"></div>
</div>


<script>
(function(){
  const box = document.getElementById("lhLightbox");
  const stage = document.getElementById("lhLightboxStage");
  const close = document.getElementById("lhLightboxClose");
  const prev = document.getElementById("lhLightboxPrev");
  const next = document.getElementById("lhLightboxNext");
  const caption = document.getElementById("lhLightboxCaption");
  const counter = document.getElementById("lhLightboxCounter");

  let items = [];
  let current = 0;

  function collectItems(){
    items = Array.from(document.querySelectorAll(
      "#eventContent .hero img, #eventContent .hero video, #eventContent .gallery img, #eventContent .gallery video"
    ));
  }

  function openAt(index){
    collectItems();
    if(!items.length) return;

    current = (index + items.length) % items.length;
    const source = items[current];

    stage.innerHTML = "";

    /*
     * The grid intentionally uses a face-aware CROPPED Cloudinary URL.
     * For the lightbox, always use the ORIGINAL uploaded URL saved in
     * data-full-src. This makes the clicked image show the complete photo.
     */
    const fullSource =
      source.getAttribute("data-full-src") ||
      source.getAttribute("src") ||
      source.currentSrc ||
      source.src;

    let media;
    if(source.tagName.toLowerCase() === "video"){
      media = document.createElement("video");
      media.src = fullSource;
      media.controls = true;
      media.playsInline = true;
      media.preload = "metadata";
    }else{
      media = document.createElement("img");
      media.src = fullSource;
      media.alt = source.alt || "";
    }

    media.className = "lh-lightbox-media";
    stage.appendChild(media);

    caption.textContent = source.alt || "";
    counter.textContent = (current + 1) + " / " + items.length;

    box.classList.add("open");
    box.setAttribute("aria-hidden","false");
    document.body.classList.add("lh-lightbox-open");
  }

  function closeBox(){
    box.classList.remove("open");
    box.setAttribute("aria-hidden","true");
    document.body.classList.remove("lh-lightbox-open");
    stage.innerHTML = "";
  }

  function move(step){
    openAt(current + step);
  }

  document.addEventListener("click", function(e){
    const media = e.target.closest(
      "#eventContent .hero img, #eventContent .hero video, #eventContent .gallery img, #eventContent .gallery video"
    );

    if(media){
      e.preventDefault();
      collectItems();
      openAt(items.indexOf(media));
      return;
    }

    if(e.target === box){
      closeBox();
    }
  });

  close.addEventListener("click", closeBox);
  prev.addEventListener("click", function(){ move(-1); });
  next.addEventListener("click", function(){ move(1); });

  document.addEventListener("keydown", function(e){
    if(!box.classList.contains("open")) return;

    if(e.key === "Escape"){
      e.preventDefault();
      closeBox();
    }else if(e.key === "ArrowLeft"){
      e.preventDefault();
      move(-1);
    }else if(e.key === "ArrowRight"){
      e.preventDefault();
      move(1);
    }
  });

  /* Touch swipe */
  let touchX = null;

  box.addEventListener("touchstart", function(e){
    if(e.touches.length === 1){
      touchX = e.touches[0].clientX;
    }
  }, {passive:true});

  box.addEventListener("touchend", function(e){
    if(touchX === null || e.changedTouches.length !== 1) return;

    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;

    if(Math.abs(dx) > 45){
      move(dx < 0 ? 1 : -1);
    }
  }, {passive:true});
})();
</script>
</body>
</html>
